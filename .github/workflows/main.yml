  - name: Install tools
    run: sudo apt-get update && sudo apt-get install -y unzip wget

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-35
        build-tools;35.0.0

  - name: Install Gradle
    run: |
      wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
      unzip -q gradle.zip -d "$HOME"
      echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

  - name: Extract Android project
    run: |
      ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository"
        exit 1
      fi
      mkdir -p game-source
      unzip -q "$ZIP_FILE" -d game-source

  - name: Find Android project
    run: |
      BUILD_FILE=$(find game-source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
      if [ -z "$BUILD_FILE" ]; then
        echo "ERROR: Android Gradle project not found"
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      else
        gradle assembleDebug --no-daemon
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Arabic-Voice-Reader-APK
      path: game-source/**/build/outputs/apk/**/*.apk
      if-no-files-found: error
